name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install server dependencies from uv.lock
        run: uv sync --frozen
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies from package-lock.json
        run: npm ci
        working-directory: web
      - name: Install bridge dependencies from uv.lock
        run: uv sync --frozen
        working-directory: bridge
      - name: Lint, test, build
        run: make check
