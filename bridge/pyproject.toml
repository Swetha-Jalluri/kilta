[project]
name = "kilta-bridge"
version = "0.1.0"
description = "Alexa+ stand-in: FastAPI bridge running a Strands agent against the Kilta MCP server"
requires-python = ">=3.12"
dependencies = [
    # strands-agents allows mcp 2.x; Kilta is pinned to the v1 SDK (spec 2025-11-25).
    "mcp>=1.27,<2",
    "strands-agents[gemini,openai,ollama]>=1.62,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
kilta-bridge = "kilta_bridge.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilta_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real model APIs (needs GEMINI_API_KEY / GROQ_API_KEY); run with `make test-live`"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
