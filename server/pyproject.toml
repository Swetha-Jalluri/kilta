[project]
name = "kilta-server"
version = "0.1.0"
description = "Kilta MCP server and safety-gated repair engine"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.9",
]

[project.scripts]
kilta-server = "kilta.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
